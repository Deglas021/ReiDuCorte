<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cadastro</title>
</head>
<body>
    <div>
        <h1 class="texto-cadastro">Cadastro</h1>
        <form action="" method="post">
            <label for="nome-completo">Nome completo:</label>
            <input type="text" id="Inome-completo" name="Inome-completo"/><br>
            <label for="cpf">CPF:</label>
            <input type="number" id="Icpf" name="cpf>
            <label for="telefone-fixo" >Telefone fixo:</label>
            <input type="number" id="Itelefone-fixo" name="telefone-fixo">
            <label for="celular">Celular:</label>
            <input type="number" name="celular" id="Icelular">
        
            <label for="rua">Rua:</label>
            <input type="text" name="rua" id="Irua"/>
            <label for="numero">Número:</label>
            <input type="number" name="numero" id="Inumero">
            <label for="cidade">Cidade:</label>
            <input type="text" name="cidade" id="Icidade">
            <label for="bairro">Bairro:</label>
            <input type="text" name="bairro" id="Ibairro">
            <label for="cep">CEP:</label>
            <input type="number" name="cep" id="Icep">
            <label for="uf">UF:</label>
            <input type="text" name="uf" id="Iuf">
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="Isenha"/>
            <label for="confirmar-senha">Confirmar senha:</label>
            <input type="password" name="confirmar-senha" id="Iconfirmar-senha">
            <button type="submit" id="bt-criar-cadastro">Criar cadastro</button>             
        </form>
    </div>
</body>
</html>
