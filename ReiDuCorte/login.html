<!DOCTYPE html>
 
<!--
  CONTRATO PARA O JAVASCRIPT (js/script.js)
  Tema, fonte e persistência: mesmo contrato do index.html (data-tema e --escala
  na tag <html>, tema e escala no localStorage, valendo para as duas páginas).
  Botões: #btn-menos, #btn-mais e #btn-tema (mesmos ids da home).
 
  FORMULÁRIO
  - <form id="form-login" method="post"> sem "action" de propósito (GET poria a senha na URL).
  - Campos: #cpf (texto) e #senha (password). Botão "Entrar": type="submit".
  - O JS deve: chamar preventDefault() no submit, aplicar a máscara do CPF,
    validar os dígitos do CPF e a senha, e redirecionar ao dashboard se estiver tudo certo.
  - O HTML só traz "required", "inputmode" e "autocomplete". Não há "pattern" nem
    "maxlength": essas regras ficam com o JS.
  - ATENÇÃO: com "required", o navegador mostra o balão de erro dele antes do evento
    submit chegar ao JS. Para controlar todas as mensagens, adicione "novalidate" no <form>.
  - Este desenho não prevê um lugar para mensagens de erro: o JS precisa de um elemento
    para isso (hoje não existe).
  - Sem o JS, enviar o formulário dá "Cannot POST" no Live Server.
 
  LINKS: logo -> index.html | "Criar cadastro" -> cadastro.html
  ATIVAR: descomentar a tag <script> no final do <body>.
-->
 
<html lang="pt-BR" data-tema="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Rei Du Corte</title>
  <!-- A ORDEM IMPORTA: global.css → acesso.css (layout comum) → css da página -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/acesso.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="acesso">
 
  <!-- Faixa/painel esquerdo: só a logo, que volta para a home -->
  <header class="acesso__lateral">
    <a href="index.html" class="acesso__logo">
      <img src="img/logobarbearia.png" alt="Rei Du Corte — ir para a página inicial" width="217" height="217">
    </a>
  </header>
 
  <main class="acesso__principal">
    <!-- Mesmo markup dos botões da home (os ícones lua/sol alternam por CSS) -->
    <div class="acesso__acessibilidade" role="group" aria-label="Acessibilidade">
      <button type="button" id="btn-menos" class="btn-acess" aria-label="Diminuir fonte">A-</button>
      <button type="button" id="btn-mais" class="btn-acess" aria-label="Aumentar fonte">A+</button>
      <button type="button" id="btn-tema" class="btn-acess" aria-label="Alternar tema claro/escuro">
        <svg class="icone-lua" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icone-sol" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
 
    <section class="acesso__card">
      <h1 class="acesso__titulo login__titulo">Login</h1>
 
      <form id="form-login" class="login__form" method="post">
        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" inputmode="numeric" autocomplete="username" required>
 
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
 
        <button type="submit" class="btn btn--contorno login__entrar">Entrar</button>
      </form>
 
      <a href="cadastro.html" class="login__cadastro">Criar cadastro</a>
    </section>
  </main>
 
  <!-- <script src="js/script.js" defer></script> -->
</body>
</html>
